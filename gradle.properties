# ============================================================
#  Gradle 自身设置
# ============================================================
org.gradle.caching = true
org.gradle.configuration-cache = true
org.gradle.welcome = never
org.gradle.daemon = true
org.gradle.jvmargs = -Xmx3G -XX:MaxMetaspaceSize=1G

# 受限环境（沙箱 / 权限收紧的目录）下 Gradle 的原生文件监视器可能报
#   "Couldn't open current thread, error = 5" (ACCESS_DENIED)
# 关掉它改用轮询。普通开发机留着也不影响。
org.gradle.vfs.watch = false

# ------------------------------------------------------------
#  Java 版本分工（重要，别搞混）
#   * 跑 Gradle 本身：必须 **Java 25**。
#     RFG 2.0.4 的 class 文件版本是 69.0（= Java 25），用 Java 17/21 会直接
#     UnsupportedClassVersionError。gradlew 通过 JAVA_HOME 找它。
#   * 编译 mod：**JDK 8**（RFG 默认 jvmLanguageVersion = 8，产出 major=52）。
#     Gradle 通过 toolchain 机制找它。
#
# 这里刻意**不写**任何机器相关的绝对路径 —— 否则别人 clone 下来就构建不了。
# 请把下面两行放进你的**全局** Gradle 配置里（Windows 是
# %GRADLE_USER_HOME%\gradle.properties，Linux/macOS 是 ~/.gradle/gradle.properties）：
#
#   org.gradle.java.installations.paths = /path/to/jdk8,/path/to/jdk21,/path/to/jdk25
#   org.gradle.java.installations.auto-download = false
#
# 或者干脆让 Gradle 自己联网下载工具链（把上面第二行删掉即可）。
# 本仓库自带的 dev.bat 会读取同目录下的 local.env.bat（已 gitignore）来设置 JAVA_HOME，
# 见 README 的「本地开发环境」一节。
# ------------------------------------------------------------

# ============================================================
#  Mod 元信息
# ============================================================
modName = PEEK Quarry
modId = peek_quarry
modGroup = com.peek.quarry
modVersion = 1.0.0
modAuthors = cao1030
modDescription = A Minecraft 1.7.10 Forge mod. Adds the Ender's Touch block: chunk scanning, block tallying and a virtual container that feeds adjacent inventories.

# 目标平台
minecraftVersion = 1.7.10
forgeVersion = 10.13.4.1614

# MCP 映射（1.7.10 用 stable_12）
mcpMappingChannel = stable
mcpMappingVersion = 12

# 开发环境 runClient 使用的玩家名
developmentEnvironmentUserName = Developer
